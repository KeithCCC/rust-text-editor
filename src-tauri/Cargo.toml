[package]
name = "koharu"
version = "0.1.3"
description = "Single-file text editor with optional Markdown preview"
authors = ["Daily AI Lab"]
edition = "2024"

[lib]
name = "koharu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.3", features = [] }
tauri-plugin-dialog = "2.4.1"
